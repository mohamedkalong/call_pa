name: Update Whitelist (Weekly)

on:
  schedule:
    - cron: '0 1 * * 1'   # Mỗi thứ Hai lúc 1:00 UTC (8:00 sáng VN)
  workflow_dispatch:        # Cho phép chạy thủ công từ GitHub UI

jobs:
  update-whitelist:
    runs-on: ubuntu-latest

    permissions:
      contents: write       # Cần quyền commit file vào repo

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install requests

      - name: Chạy whitelist.py
        run: python whitelist.py

      - name: Commit whitelist.json vào repo
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add whitelist.json
          git diff --staged --quiet || git commit -m "chore: update whitelist.json [$(date -u '+%Y-%m-%d')]"
          git push
